name: Release WhisperBox Basecamp catalog

# Build the portable WhisperBox .lgx artifacts, publish them as GitHub Release
# assets, and regenerate index.json so the PUBLIC Basecamp catalog points at
# those release-download URLs.
#
#   - push a tag `catalog-v*`  -> build + release under that tag + commit index.json
#   - manual dispatch          -> same, using the `tag` input (default
#                                 catalog-v0.1.0) and `wb_ref` to pick which
#                                 branch/tag/SHA of vpavlin/whisperbox-logos to build.
#
# Artifacts:
#   * whisperbox_core (.lgx) + whisperbox view (.lgx) -> built REPRODUCIBLY here
#     via nix from the PUBLIC source repo (vpavlin/whisperbox-logos). No token
#     needed; only the built-in GITHUB_TOKEN is used (release + index commit).
#   * delivery_module (.lgx) -> NOT nix-reproducible (hand-repacked channels
#     build, same artifact KYM ships). VENDORED at vendor/*.lgx, attached as-is.
#     To refresh it, rebuild out-of-band and replace the vendored file.
#
# amd64 only for now (portable / linux-amd64 variant, like every official Logos
# package). Add arm runners when arm64 Basecamp hosts are targeted.

on:
  push:
    tags: ["catalog-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build the catalog under"
        required: true
        default: "catalog-v0.1.0"
      wb_ref:
        description: "Branch/tag/SHA of vpavlin/whisperbox-logos to build from"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage vendored artifacts
        run: |
          mkdir -p dist
          cp -L vendor/*.lgx dist/
          ls -la dist

      # --- nix build of whisperbox_core + whisperbox from the PUBLIC source ---
      - name: Checkout WhisperBox source
        uses: actions/checkout@v4
        with:
          repository: vpavlin/whisperbox-logos
          ref: ${{ github.event.inputs.wb_ref || 'main' }}
          path: wb-src
          submodules: recursive
          fetch-depth: 0

      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build whisperbox_core + whisperbox portable .lgx
        run: |
          nix build ./wb-src/#whisperbox_core -o core-out --print-out-paths
          cp -L core-out/*.lgx dist/logos-whisperbox_core-module-lib.lgx
          nix build ./wb-src/#whisperbox -o view-out --print-out-paths
          cp -L view-out/*.lgx dist/logos-whisperbox-module.lgx
          ls -la dist

      # --- release + catalog ---
      - name: Publish GitHub Release with all .lgx
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: WhisperBox Basecamp catalog ${{ steps.tag.outputs.value }}
          files: dist/*.lgx
          fail_on_unmatched_files: true

      - name: Regenerate index.json (public release URLs)
        run: |
          python3 scripts/gen-index.py "${GITHUB_REPOSITORY}" "${{ steps.tag.outputs.value }}" dist/*.lgx > index.json
          cat index.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('packages:', [(p['name'], p['versions'][0]['manifest']['version']) for p in d['packages']])"

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "ci: refresh catalog index for ${{ steps.tag.outputs.value }}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
